services:
  - type: web
    name: tacticaledge-api-dev
    runtime: node
    plan: starter
    # Deploys from main (board work and the mobile app both merged there).
    branch: main
    rootDir: .
    healthCheckPath: /health
    # No `prisma migrate deploy` here: migrations are applied deliberately, not on every build.
    # link-shared-runtime.mjs must run last: it makes the compiled API load @aci/shared.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter api exec prisma generate && pnpm --filter api exec tsc -p tsconfig.json && node apps/api/scripts/link-shared-runtime.mjs
    # Direct node: avoids Corepack downloading pnpm at startup.
    startCommand: node apps/api/dist/apps/api/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_PRIMARY
        value: gemini-3.1-flash-lite-preview
      - key: GEMINI_MODEL_FALLBACK
        value: gemini-3.5-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-3.1-flash-lite-preview
      - key: GEMINI_QA_MODEL
        value: gemini-3.1-flash-lite-preview
      - key: GEMINI_DIAGRAM_ENRICHMENT_MODEL
        value: gemini-3.1-flash-lite-preview
      - key: GEMINI_DRAWER_MODEL
        value: gemini-3.5-flash
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DEV_SEED_SECRET
        sync: false
      - key: ENABLE_DEV_SEED_ROUTES
        sync: false
