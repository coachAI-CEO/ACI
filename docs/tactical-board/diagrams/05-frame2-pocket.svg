<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="t5">
  <title id="t5">Frame 2 pocket after high press</title>
  <rect width="920" height="480" fill="#0b1220"/>
  <text x="460" y="24" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15" font-weight="700">5 - Frame 2 pocket AFTER high-press Frame 1 (goal-kick default)</text>
  <text x="460" y="44" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">First line is broken - DEF does not "step up from deep" (they were already high). Cover becomes the new press; back line is already tight.</text>

  <g transform="translate(60,60)">
    <rect width="800" height="300" rx="4" fill="#1a7a3c"/>
    <rect width="800" height="300" fill="none" stroke="#fff" stroke-width="2.5"/>
    <line x1="400" y1="0" x2="400" y2="300" stroke="#fff" stroke-width="2" opacity="0.75"/>
    <circle cx="400" cy="150" r="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.75"/>
    <rect x="0" y="75" width="70" height="150" fill="none" stroke="#fff" stroke-width="2" opacity="0.75"/>
    <rect x="730" y="75" width="70" height="150" fill="none" stroke="#fff" stroke-width="2" opacity="0.75"/>
    <rect x="-8" y="120" width="8" height="60" fill="#ef4444"/>
    <rect x="800" y="120" width="8" height="60" fill="#3b82f6"/>

    <!-- ghost F1 high-press zone -->
    <rect x="560" y="65" width="180" height="160" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" opacity="0.75"/>
    <text x="650" y="58" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">F1 high-press zone (beaten)</text>

    <!-- pocket focus -->
    <rect x="300" y="70" width="200" height="160" fill="#fbbf24" opacity="0.22" stroke="#fbbf24" stroke-width="3"/>
    <text x="400" y="62" text-anchor="middle" fill="#fde68a" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Pocket between lines</text>
    <circle cx="400" cy="150" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/>

    <!-- ATT -->
    <circle cx="740" cy="150" r="12" fill="#1e3a8a" stroke="#fff" stroke-width="1.5"/><text x="740" y="154" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">1</text>
    <circle cx="580" cy="105" r="13" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="580" y="109" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">4</text>
    <circle cx="580" cy="200" r="13" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="580" y="204" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">5</text>
    <circle cx="420" cy="150" r="15" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="420" y="155" text-anchor="middle" fill="#fff" font-size="11" font-family="system-ui" font-weight="700">6</text>
    <circle cx="370" cy="100" r="13" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="370" y="104" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">8</text>
    <circle cx="370" cy="205" r="13" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="370" y="209" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">10</text>
    <circle cx="520" cy="45" r="12" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="520" y="49" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">2</text>
    <circle cx="520" cy="260" r="12" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="520" y="264" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">3</text>
    <circle cx="280" cy="60" r="12" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="280" y="64" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">7</text>
    <circle cx="280" cy="245" r="12" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="280" y="249" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">11</text>
    <circle cx="230" cy="150" r="12" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="230" y="154" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">9</text>

    <defs>
      <marker id="pW" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#fff"/></marker>
      <marker id="pO" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#fdba74"/></marker>
      <marker id="pR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#f87171"/></marker>
      <marker id="pG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#94a3b8"/></marker>
    </defs>
    <!-- pass into pocket -->
    <line x1="565" y1="120" x2="438" y2="148" stroke="#fff" stroke-width="2.5" marker-end="url(#pW)"/>
    <line x1="385" y1="110" x2="410" y2="140" stroke="#fdba74" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#pO)"/>
    <!-- cover jumps the receiver -->
    <line x1="340" y1="130" x2="400" y2="148" stroke="#f87171" stroke-width="2.5" marker-end="url(#pR)"/>
    <!-- bypassed pressers recovering (behind the ball) -->
    <line x1="500" y1="100" x2="460" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pG)"/>
    <line x1="500" y1="200" x2="460" y2="170" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pG)"/>

    <!-- DEF after high press broken -->
    <!-- Bypassed front two: BEHIND ball / recovering (right of pocket) -->
    <circle cx="490" cy="95" r="13" fill="#dc2626" stroke="#fff" stroke-width="1.5" opacity="0.85"/><text x="490" y="99" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">9</text>
    <circle cx="490" cy="205" r="13" fill="#dc2626" stroke="#fff" stroke-width="1.5" opacity="0.85"/><text x="490" y="209" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">10</text>
    <text x="490" y="85" text-anchor="middle" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="9">bypassed / recover</text>

    <!-- Old cover = NEW press on pocket receiver -->
    <circle cx="335" cy="115" r="14" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="335" y="119" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">8</text>
    <circle cx="335" cy="185" r="14" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="335" y="189" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">6</text>
    <circle cx="350" cy="55" r="12" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="350" y="59" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">7</text>
    <circle cx="350" cy="250" r="12" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="350" y="254" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">11</text>
    <text x="320" y="290" text-anchor="middle" fill="#fb7185" font-family="system-ui,sans-serif" font-size="10" font-weight="700">NEW press (was cover)</text>

    <!-- Back line already high / tight to pocket -->
    <circle cx="240" cy="70" r="12" fill="#b91c1c" stroke="#fff" stroke-width="1.5"/><text x="240" y="74" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">2</text>
    <circle cx="240" cy="125" r="12" fill="#b91c1c" stroke="#fff" stroke-width="1.5"/><text x="240" y="129" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">4</text>
    <circle cx="240" cy="180" r="12" fill="#b91c1c" stroke="#fff" stroke-width="1.5"/><text x="240" y="184" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">5</text>
    <circle cx="240" cy="235" r="12" fill="#b91c1c" stroke="#fff" stroke-width="1.5"/><text x="240" y="239" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">3</text>
    <text x="240" y="290" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="10" font-weight="700">BACK already high</text>

    <circle cx="40" cy="150" r="12" fill="#7f1d1d" stroke="#fff" stroke-width="1.5"/><text x="40" y="154" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">1</text>

    <rect x="120" y="305" width="560" height="22" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" transform="translate(0,-8)"/>
    <text x="400" y="312" text-anchor="middle" fill="#fef3c7" font-family="system-ui,sans-serif" font-size="11">ATT #6 receives behind the first press; DEF #8 jumps; #9+#10 recover from behind the ball</text>
  </g>

  <text x="460" y="420" text-anchor="middle" fill="#86efac" font-family="system-ui,sans-serif" font-size="12" font-weight="600">High-press F1 consequence: pocket is BETWEEN their lines, not "step everyone up from the left"</text>
  <text x="460" y="445" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Vs low-block F1, Frame 2 would instead show DEF stepping UP into midfield from a deeper start</text>
</svg>
