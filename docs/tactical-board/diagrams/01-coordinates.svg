<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-labelledby="t1">
  <title id="t1">Board coordinates - horizontal pitch</title>
  <rect width="920" height="380" fill="#0b1220"/>
  <text x="460" y="28" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="16" font-weight="700">1 - Coordinate system (HORIZONTAL pitch)</text>

  <g transform="translate(60,55)">
    <rect width="800" height="240" rx="4" fill="#1a7a3c"/>
    <rect width="800" height="240" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
    <line x1="400" y1="0" x2="400" y2="240" stroke="#fff" stroke-width="2" opacity="0.85"/>
    <circle cx="400" cy="120" r="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.85"/>
    <circle cx="400" cy="120" r="3" fill="#fff"/>
    <rect x="0" y="55" width="70" height="130" fill="none" stroke="#fff" stroke-width="2" opacity="0.85"/>
    <rect x="730" y="55" width="70" height="130" fill="none" stroke="#fff" stroke-width="2" opacity="0.85"/>
    <rect x="0" y="85" width="28" height="70" fill="none" stroke="#fff" stroke-width="2" opacity="0.85"/>
    <rect x="772" y="85" width="28" height="70" fill="none" stroke="#fff" stroke-width="2" opacity="0.85"/>
    <!-- goals -->
    <rect x="-10" y="100" width="10" height="40" fill="#ef4444" opacity="0.85"/>
    <rect x="800" y="100" width="10" height="40" fill="#3b82f6" opacity="0.9"/>

    <!-- thirds -->
    <rect x="0" y="0" width="264" height="240" fill="#ef4444" opacity="0.12"/>
    <rect x="264" y="0" width="272" height="240" fill="#fbbf24" opacity="0.10"/>
    <rect x="536" y="0" width="264" height="240" fill="#3b82f6" opacity="0.12"/>

    <text x="132" y="26" text-anchor="middle" fill="#fecaca" font-family="system-ui,sans-serif" font-size="12" font-weight="600">LEFT third  y 0-33</text>
    <text x="132" y="44" text-anchor="middle" fill="#fecaca" font-family="system-ui,sans-serif" font-size="11">DEF own goal / ATT final third</text>
    <text x="400" y="26" text-anchor="middle" fill="#fde68a" font-family="system-ui,sans-serif" font-size="12" font-weight="600">MIDDLE  y 34-66</text>
    <text x="400" y="44" text-anchor="middle" fill="#fde68a" font-family="system-ui,sans-serif" font-size="11">pocket / midfield</text>
    <text x="668" y="26" text-anchor="middle" fill="#bfdbfe" font-family="system-ui,sans-serif" font-size="12" font-weight="600">RIGHT third  y 67-100</text>
    <text x="668" y="44" text-anchor="middle" fill="#bfdbfe" font-family="system-ui,sans-serif" font-size="11">ATT own goal / build-out</text>

    <defs>
      <marker id="arrowWhiteR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#cbd5e1"/></marker>
      <marker id="arrowBlueL" markerWidth="10" markerHeight="10" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 Z" fill="#60a5fa"/></marker>
      <marker id="arrowCyanD" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a5f3fc"/></marker>
    </defs>

    <!-- diagram-y axis: increasing LEFT -> RIGHT (coordinate only) -->
    <line x1="30" y1="218" x2="770" y2="218" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowWhiteR)" opacity="0.95"/>
    <text x="30" y="236" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11">y=0</text>
    <text x="770" y="236" text-anchor="end" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11">y=100</text>
    <text x="400" y="236" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">diagram y increases this way</text>

    <!-- ATT attack direction: RIGHT -> LEFT (decreasing y) -->
    <line x1="720" y1="160" x2="90" y2="160" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrowBlueL)"/>
    <rect x="250" y="142" width="300" height="24" rx="6" fill="#0f172a" opacity="0.85"/>
    <text x="400" y="159" text-anchor="middle" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="13" font-weight="700">ATT (blue) attacks LEFT  = decreasing y</text>

    <!-- x axis -->
    <line x1="20" y1="20" x2="20" y2="200" stroke="#a5f3fc" stroke-width="2" marker-end="url(#arrowCyanD)"/>
    <text x="8" y="110" fill="#a5f3fc" font-family="system-ui,sans-serif" font-size="11" transform="rotate(-90 8 110)">x (width / channel)</text>

    <text x="20" y="125" text-anchor="middle" fill="#fecaca" font-family="system-ui,sans-serif" font-size="13" font-weight="700">DEF</text>
    <text x="780" y="125" text-anchor="middle" fill="#bfdbfe" font-family="system-ui,sans-serif" font-size="13" font-weight="700">ATT</text>
  </g>

  <text x="460" y="340" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">Blue ATT own goal RIGHT  -  Red DEF own goal LEFT  -  ATT progresses toward the left goal</text>
  <text x="460" y="362" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">Build-out starts on the RIGHT; final third is on the LEFT</text>
</svg>
