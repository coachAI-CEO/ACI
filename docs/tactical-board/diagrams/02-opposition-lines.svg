<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="t2">
  <title id="t2">Opposition lines - goal kick high press default</title>
  <rect width="920" height="400" fill="#0b1220"/>
  <text x="460" y="26" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15" font-weight="700">2 - Opposition model (DEFAULT goal-kick play-out = HIGH block)</text>
  <text x="460" y="46" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">Press on the box edge - cover just behind - back line still in ATT half. Only GK stays deep.</text>

  <g transform="translate(60,60)">
    <rect width="800" height="260" rx="4" fill="#1a7a3c"/>
    <rect width="800" height="260" fill="none" stroke="#fff" stroke-width="2.5"/>
    <line x1="400" y1="0" x2="400" y2="260" stroke="#fff" stroke-width="2" opacity="0.7"/>
    <circle cx="400" cy="130" r="34" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>
    <rect x="0" y="60" width="60" height="140" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>
    <rect x="740" y="60" width="60" height="140" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>
    <rect x="-8" y="100" width="8" height="60" fill="#ef4444"/>
    <rect x="800" y="100" width="8" height="60" fill="#3b82f6"/>

    <rect x="580" y="55" width="170" height="150" fill="#fbbf24" opacity="0.22" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="700" cy="130" r="8" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="665" y="48" text-anchor="middle" fill="#fde68a" font-family="system-ui,sans-serif" font-size="11" font-weight="700">FOCUS (GK / box)</text>

    <circle cx="745" cy="130" r="13" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="745" y="134" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">1</text>
    <circle cx="670" cy="95" r="13" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="670" y="99" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">4</text>
    <circle cx="670" cy="170" r="13" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="670" y="174" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">5</text>
    <circle cx="620" cy="130" r="13" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="620" y="134" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">6</text>

    <!-- PRESS on box -->
    <line x1="560" y1="30" x2="560" y2="230" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="565" cy="90" r="13" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="565" y="94" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">9</text>
    <circle cx="565" cy="130" r="13" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="565" y="134" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">10</text>
    <circle cx="565" cy="170" r="13" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="565" y="174" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui" font-weight="700">8</text>
    <text x="560" y="22" text-anchor="middle" fill="#fb7185" font-family="system-ui,sans-serif" font-size="11" font-weight="700">PRESS = box edge</text>

    <!-- COVER tight behind -->
    <line x1="500" y1="30" x2="500" y2="230" stroke="#fdba74" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="500" cy="85" r="12" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="500" y="89" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">7</text>
    <circle cx="500" cy="130" r="12" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="500" y="134" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">6</text>
    <circle cx="500" cy="175" r="12" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="500" y="179" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">11</text>
    <text x="500" y="22" text-anchor="middle" fill="#fdba74" font-family="system-ui,sans-serif" font-size="11" font-weight="700">COVER ~8-12 behind</text>

    <!-- BACK still high (ATT half) -->
    <line x1="430" y1="30" x2="430" y2="230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="430" cy="70" r="12" fill="#b91c1c" stroke="#fff" stroke-width="1.5"/><text x="430" y="74" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">2</text>
    <circle cx="430" cy="110" r="12" fill="#b91c1c" stroke="#fff" stroke-width="1.5"/><text x="430" y="114" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">4</text>
    <circle cx="430" cy="150" r="12" fill="#b91c1c" stroke="#fff" stroke-width="1.5"/><text x="430" y="154" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">5</text>
    <circle cx="430" cy="190" r="12" fill="#b91c1c" stroke="#fff" stroke-width="1.5"/><text x="430" y="194" text-anchor="middle" fill="#fff" font-size="9" font-family="system-ui" font-weight="700">3</text>
    <text x="430" y="22" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11" font-weight="700">BACK still HIGH</text>

    <!-- wrong zone -->
    <rect x="20" y="70" width="110" height="120" fill="#000" opacity="0.35" stroke="#f87171" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="75" y="125" text-anchor="middle" fill="#fecaca" font-family="system-ui,sans-serif" font-size="11" font-weight="700">WRONG</text>
    <text x="75" y="142" text-anchor="middle" fill="#fecaca" font-family="system-ui,sans-serif" font-size="10">conservative</text>
    <text x="75" y="158" text-anchor="middle" fill="#fecaca" font-family="system-ui,sans-serif" font-size="10">deep block</text>
    <circle cx="40" cy="130" r="11" fill="#7f1d1d" stroke="#fff" stroke-width="1"/><text x="40" y="134" text-anchor="middle" fill="#fff" font-size="8" font-family="system-ui">GK</text>
  </g>

  <text x="460" y="370" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">Goal-kick default: outfield DEF compressed into the RIGHT third / edge of ATT box - not parked left</text>
</svg>
