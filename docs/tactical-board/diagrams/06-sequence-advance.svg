<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-labelledby="t6">
  <title id="t6">Sequence focus advances - high press story</title>
  <rect width="920" height="380" fill="#0b1220"/>
  <text x="460" y="26" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15" font-weight="700">6 - Sequence overview (DEFAULT: high-press goal kick)</text>
  <text x="460" y="46" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">DEF starts high - rotates in the pocket - only deep in Frame 3 when recovering</text>

  <g font-family="system-ui,sans-serif">
    <g transform="translate(30,65)">
      <text x="130" y="0" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">F1 Goal kick</text>
      <rect y="12" width="260" height="140" rx="3" fill="#1a7a3c" stroke="#fff" stroke-width="1.5"/>
      <line x1="130" y1="12" x2="130" y2="152" stroke="#fff" stroke-width="1" opacity="0.6"/>
      <rect x="170" y="40" width="70" height="70" fill="#fbbf24" opacity="0.3" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="210" cy="75" r="6" fill="#2563eb"/><circle cx="195" cy="95" r="6" fill="#2563eb"/>
      <circle cx="165" cy="60" r="6" fill="#dc2626"/><circle cx="165" cy="90" r="6" fill="#dc2626"/>
      <circle cx="140" cy="75" r="5" fill="#dc2626"/><circle cx="115" cy="75" r="5" fill="#b91c1c"/>
      <text x="130" y="175" text-anchor="middle" fill="#94a3b8" font-size="11">DEF high on the box</text>
    </g>

    <text x="310" y="140" fill="#e2e8f0" font-size="26">-</text>

    <g transform="translate(330,65)">
      <text x="130" y="0" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">F2 Pocket</text>
      <rect y="12" width="260" height="140" rx="3" fill="#1a7a3c" stroke="#fff" stroke-width="1.5"/>
      <line x1="130" y1="12" x2="130" y2="152" stroke="#fff" stroke-width="1" opacity="0.6"/>
      <rect x="95" y="40" width="70" height="70" fill="#fbbf24" opacity="0.3" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="130" cy="75" r="6" fill="#2563eb"/>
      <circle cx="155" cy="55" r="5" fill="#dc2626" opacity="0.7"/><circle cx="155" cy="95" r="5" fill="#dc2626" opacity="0.7"/>
      <circle cx="90" cy="65" r="6" fill="#dc2626"/><circle cx="90" cy="90" r="6" fill="#dc2626"/>
      <circle cx="60" cy="75" r="5" fill="#b91c1c"/>
      <text x="130" y="175" text-anchor="middle" fill="#94a3b8" font-size="11">first line broken / cover jumps</text>
    </g>

    <text x="610" y="140" fill="#e2e8f0" font-size="26">-</text>

    <g transform="translate(630,65)">
      <text x="125" y="0" text-anchor="middle" fill="#86efac" font-size="13" font-weight="700">F3 Final third</text>
      <rect y="12" width="250" height="140" rx="3" fill="#1a7a3c" stroke="#fff" stroke-width="1.5"/>
      <line x1="125" y1="12" x2="125" y2="152" stroke="#fff" stroke-width="1" opacity="0.6"/>
      <rect x="20" y="40" width="70" height="70" fill="#fbbf24" opacity="0.3" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="50" cy="60" r="6" fill="#2563eb"/><circle cx="45" cy="90" r="6" fill="#2563eb"/>
      <circle cx="35" cy="55" r="5" fill="#b91c1c"/><circle cx="30" cy="85" r="5" fill="#b91c1c"/>
      <circle cx="85" cy="70" r="5" fill="#dc2626"/><circle cx="110" cy="50" r="4" fill="#dc2626" opacity="0.7"/>
      <text x="125" y="175" text-anchor="middle" fill="#94a3b8" font-size="11">DEF recovers to their box</text>
    </g>
  </g>

  <rect x="60" y="270" width="800" height="80" rx="10" fill="#111827" stroke="#334155"/>
  <text x="460" y="300" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Deep DEF on the LEFT is wrong in F1, OK in F3</text>
  <text x="460" y="325" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">F1 = high press  |  F2 = rotate lines around pocket  |  F3 = rest defence / recovery</text>
</svg>
