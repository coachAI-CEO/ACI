<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ACI Board — Landscape mock (Gemini shell)</title>
<style>
  :root {
    --bg: #020617;
    --panel: #0f172a;
    --panel-2: #020617;
    --border: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --emerald: #22c55e;
    --emerald-dim: rgba(34,197,94,0.2);
    --red: #ef4444;
    --amber: #eab308;
    --indigo: #818cf8;
    --pitch: #0c2f24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; }
  .device {
    width: min(1280px, 100%);
    height: min(720px, 100vh - 32px);
    background: var(--bg);
    border: 1px solid #1e293b;
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 80px rgba(0,0,0,0.65);
  }
  header {
    height: 48px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; background: rgba(15,23,42,0.95); border-bottom: 1px solid rgba(30,41,59,0.8);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 24px; height: 24px; border-radius: 8px;
    background: var(--emerald-dim); border: 1px solid var(--emerald);
    display: grid; place-items: center; color: #34d399; font-size: 12px; font-weight: 900;
  }
  .brand h1 { margin: 0; font-size: 13px; font-weight: 700; }
  .brand h1 span { color: #34d399; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; margin-left: 4px; }
  .hist { display: flex; gap: 2px; background: rgba(30,41,59,0.6); border: 1px solid rgba(51,65,85,0.5); border-radius: 8px; padding: 2px; }
  .hist button, .icon-btn {
    background: transparent; border: 0; color: var(--muted); width: 28px; height: 28px;
    border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  .hist button:hover, .icon-btn:hover { background: #334155; color: #fff; }
  .center-controls { display: flex; gap: 8px; align-items: center; }
  .seg {
    display: flex; background: rgba(2,6,23,0.8); border: 1px solid #1e293b; border-radius: 8px; padding: 2px;
  }
  .seg button {
    border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 600;
    padding: 5px 10px; border-radius: 6px; cursor: pointer;
  }
  .seg button.active { background: var(--emerald); color: #052e16; font-weight: 800; }
  .right-actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    border: 1px solid var(--border); background: rgba(15,23,42,0.8); color: var(--text);
    border-radius: 8px; padding: 6px 10px; font-size: 11px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn.zones.active { border-color: rgba(56,189,248,0.5); color: #7dd3fc; background: rgba(14,165,233,0.12); }
  .btn.save { background: var(--emerald); color: #052e16; border-color: var(--emerald); font-weight: 800; }
  .workspace { flex: 1; display: flex; min-height: 0; position: relative; }
  .tools {
    width: 64px; flex-shrink: 0; background: rgba(15,23,42,0.95); border-right: 1px solid rgba(30,41,59,0.8);
    display: flex; flex-direction: column; align-items: center; padding: 12px 8px; gap: 8px;
  }
  .tools .cap { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #64748b; }
  .tool {
    width: 100%; aspect-ratio: 1; border: 0; border-radius: 12px; background: transparent;
    color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 9px; font-weight: 600;
  }
  .tool .g { font-size: 15px; line-height: 1; }
  .tool.active { background: var(--emerald); color: #052e16; font-weight: 800; box-shadow: 0 8px 20px rgba(34,197,94,0.25); }
  .tool.erase.active { background: var(--red); color: #fff; }
  .tools .spacer { flex: 1; width: 32px; border-top: 1px solid #1e293b; margin: 8px 0 0; }
  .trash {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid #1e293b; background: rgba(30,41,59,0.4);
    color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .pitch-area {
    flex: 1; background: var(--bg); padding: 12px; display: flex; align-items: center; justify-content: center;
    position: relative; min-width: 0;
  }
  .hint {
    position: absolute; top: 16px; left: 20px; z-index: 5;
    background: rgba(15,23,42,0.92); border: 1px solid rgba(51,65,85,0.8);
    border-radius: 999px; padding: 6px 12px; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; gap: 8px; pointer-events: none;
  }
  .hint .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }
  .pitch {
    width: 100%; max-width: 900px; aspect-ratio: 1.54 / 1; max-height: 100%;
    background: radial-gradient(ellipse at center, #0f3d2e 0%, #08241b 100%);
    border: 2px solid rgba(6,78,59,0.6); border-radius: 16px; position: relative; overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.45);
  }
  .stripes { position: absolute; inset: 0; display: flex; opacity: 0.12; pointer-events: none; }
  .stripes span { flex: 1; }
  .stripes span:nth-child(odd) { background: #fff; }
  .pitch svg.markings, .pitch svg.grid, .pitch svg.arrows { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grid { opacity: 0.3; pointer-events: none; }
  .player {
    position: absolute; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; color: #052e16; box-shadow: 0 8px 18px rgba(0,0,0,0.35); cursor: pointer;
    z-index: 2;
  }
  .player.att { background: var(--emerald); }
  .player.def { background: var(--red); color: #fff; }
  .player.selected { outline: 2px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 4px rgba(34,197,94,0.45); }
  .player .role {
    position: absolute; top: 100%; margin-top: 2px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 700; color: #cbd5e1; background: rgba(2,6,23,0.8);
    padding: 1px 4px; border-radius: 4px; white-space: nowrap; pointer-events: none;
  }
  .ball {
    position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    background: #fff; border: 2px solid #0f172a; z-index: 3; box-shadow: 0 6px 14px rgba(0,0,0,0.4);
  }
  .ball::after {
    content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #0f172a;
  }
  .hud {
    width: 224px; flex-shrink: 0; background: rgba(15,23,42,0.95); border-left: 1px solid rgba(30,41,59,0.8);
    padding: 14px; display: flex; flex-direction: column; gap: 14px; overflow: auto;
  }
  .hud .cap {
    font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .hud .cap em { font-style: normal; color: #34d399; font-family: ui-monospace, monospace; font-size: 9px; }
  .team-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: rgba(2,6,23,0.8); border: 1px solid #1e293b; border-radius: 12px; padding: 4px; }
  .team-grid button {
    border: 0; border-radius: 8px; padding: 7px 0; font-size: 11px; font-weight: 800; cursor: pointer;
    background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .team-grid button .d { width: 8px; height: 8px; border-radius: 50%; }
  .team-grid button.active.att { background: rgba(34,197,94,0.2); color: #86efac; }
  .team-grid button.active.def { background: rgba(239,68,68,0.2); color: #fca5a5; }
  .team-grid button.active.neu { background: rgba(234,179,8,0.2); color: #fde68a; }
  .arrow-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .arrow-grid button {
    border: 1px solid #1e293b; background: rgba(2,6,23,0.7); color: var(--muted);
    border-radius: 8px; padding: 8px; font-size: 11px; font-weight: 600; text-align: left; cursor: pointer;
  }
  .arrow-grid button.active { border-color: rgba(34,197,94,0.5); background: rgba(34,197,94,0.12); color: #86efac; }
  .inspector {
    flex: 1; background: rgba(2,6,23,0.7); border: 1px solid rgba(30,41,59,0.9); border-radius: 12px;
    padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 160px;
  }
  .inspector label { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 4px; }
  .inspector input {
    width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    color: #fff; padding: 7px 10px; font-size: 12px;
  }
  .inspector .empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #64748b; font-size: 11px; gap: 6px;
  }
  .remove {
    width: 100%; border: 1px solid rgba(239,68,68,0.4); background: rgba(127,29,29,0.25);
    color: #fca5a5; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  footer {
    height: 64px; flex-shrink: 0; background: #0f172a; border-top: 1px solid rgba(30,41,59,0.9);
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 12px;
  }
  .play {
    border: 0; border-radius: 12px; padding: 10px 16px; font-size: 12px; font-weight: 800;
    background: var(--emerald); color: #052e16; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 10px 24px rgba(34,197,94,0.2);
  }
  .frame-meta { font-size: 12px; color: #94a3b8; font-family: ui-monospace, monospace; }
  .frame-meta b { color: #fff; }
  .phases { flex: 1; max-width: 560px; display: flex; gap: 8px; overflow: auto; }
  .phase {
    flex: 1; min-width: 120px; text-align: left; border-radius: 12px; border: 1px solid #1e293b;
    background: rgba(2,6,23,0.6); color: var(--muted); padding: 6px 12px; cursor: pointer;
  }
  .phase.active { border-color: var(--emerald); background: rgba(30,41,59,0.9); color: #fff; }
  .phase .p { font-size: 10px; font-family: ui-monospace, monospace; margin-bottom: 2px; display: flex; justify-content: space-between; }
  .phase.active .p { color: #34d399; font-weight: 800; }
  .phase .n { font-size: 12px; font-weight: 800; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); }
  .frame-actions { display: flex; gap: 6px; }
  .frame-actions button {
    border: 1px solid #334155; background: #1e293b; color: #e2e8f0; border-radius: 12px;
    padding: 7px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  .note {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(15,23,42,0.95); border: 1px solid #334155; color: #94a3b8;
    font-size: 11px; padding: 6px 12px; border-radius: 999px; z-index: 20;
  }
  .note strong { color: #e2e8f0; }
</style>
</head>
<body>
  <div class="device" id="app">
    <header>
      <div class="brand">
        <div class="logo">⚡</div>
        <h1>TacticsLab <span>LANDSCAPE</span></h1>
        <div class="hist">
          <button type="button" title="Undo">↶</button>
          <button type="button" title="Redo">↷</button>
        </div>
      </div>
      <div class="center-controls">
        <div class="seg" id="fmt">
          <button type="button">7v7</button>
          <button type="button">9v9</button>
          <button type="button" class="active">11v11</button>
        </div>
        <div class="seg" id="zoom">
          <button type="button" class="active">Full</button>
          <button type="button">Att Half</button>
          <button type="button">Def Half</button>
        </div>
      </div>
      <div class="right-actions">
        <button type="button" class="btn zones active" id="zones">▦ Zones</button>
        <button type="button" class="btn save">💾 Save</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="tools">
        <div class="cap">Tools</div>
        <button type="button" class="tool active" data-tool="move"><span class="g">✥</span>Move</button>
        <button type="button" class="tool" data-tool="player"><span class="g">●</span>Player</button>
        <button type="button" class="tool" data-tool="arrow"><span class="g">→</span>Arrow</button>
        <button type="button" class="tool" data-tool="ball"><span class="g">◉</span>Ball</button>
        <button type="button" class="tool" data-tool="label"><span class="g">T</span>Label</button>
        <button type="button" class="tool" data-tool="shape"><span class="g">◎</span>Shape</button>
        <button type="button" class="tool" data-tool="kit"><span class="g">△</span>Kit</button>
        <button type="button" class="tool erase" data-tool="erase"><span class="g">⌫</span>Erase</button>
        <div class="spacer"></div>
        <button type="button" class="trash" title="Clear arrows">🗑</button>
      </aside>

      <main class="pitch-area">
        <div class="hint"><span class="dot"></span><span id="hint">MOVE: DRAG PLAYERS &amp; BALL</span></div>
        <div class="pitch" id="pitch">
          <div class="stripes" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <svg class="grid" id="grid" viewBox="0 0 100 100" preserveAspectRatio="none">
            <line x1="0" y1="18" x2="100" y2="18" stroke="#38bdf8" stroke-width="0.35" stroke-dasharray="1.2 1.2"/>
            <line x1="0" y1="36" x2="100" y2="36" stroke="#38bdf8" stroke-width="0.35" stroke-dasharray="1.2 1.2"/>
            <line x1="0" y1="64" x2="100" y2="64" stroke="#38bdf8" stroke-width="0.35" stroke-dasharray="1.2 1.2"/>
            <line x1="0" y1="82" x2="100" y2="82" stroke="#38bdf8" stroke-width="0.35" stroke-dasharray="1.2 1.2"/>
            <line x1="16.5" y1="0" x2="16.5" y2="100" stroke="#38bdf8" stroke-width="0.35" stroke-dasharray="1.2 1.2"/>
            <line x1="33" y1="0" x2="33" y2="100" stroke="#38bdf8" stroke-width="0.35" stroke-dasharray="1.2 1.2"/>
            <line x1="67" y1="0" x2="67" y2="100" stroke="#38bdf8" stroke-width="0.35" stroke-dasharray="1.2 1.2"/>
            <line x1="83.5" y1="0" x2="83.5" y2="100" stroke="#38bdf8" stroke-width="0.35" stroke-dasharray="1.2 1.2"/>
          </svg>
          <svg class="markings" viewBox="0 0 105 68">
            <rect x="2" y="2" width="101" height="64" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
            <line x1="52.5" y1="2" x2="52.5" y2="66" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
            <circle cx="52.5" cy="34" r="9.15" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
            <circle cx="52.5" cy="34" r="0.8" fill="rgba(255,255,255,0.8)"/>
            <rect x="2" y="13.84" width="16.5" height="40.32" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
            <rect x="2" y="24.84" width="5.5" height="18.32" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
            <circle cx="13" cy="34" r="0.6" fill="rgba(255,255,255,0.8)"/>
            <path d="M 18.5 27.5 A 9.15 9.15 0 0 1 18.5 40.5" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
            <rect x="0.2" y="29.5" width="1.8" height="9" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.8)" stroke-width="0.7"/>
            <rect x="86.5" y="13.84" width="16.5" height="40.32" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
            <rect x="97.5" y="24.84" width="5.5" height="18.32" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
            <circle cx="92" cy="34" r="0.6" fill="rgba(255,255,255,0.8)"/>
            <path d="M 86.5 27.5 A 9.15 9.15 0 0 0 86.5 40.5" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
            <rect x="103" y="29.5" width="1.8" height="9" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.8)" stroke-width="0.7"/>
          </svg>
          <svg class="arrows" viewBox="0 0 100 100" preserveAspectRatio="none">
            <defs>
              <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
              </marker>
              <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                <path d="M0 0 L10 5 L0 10 z" fill="#a855f7"/>
              </marker>
            </defs>
            <line x1="62" y1="48" x2="50" y2="38" stroke="#38bdf8" stroke-width="0.9" marker-end="url(#ah)"/>
            <line x1="50" y1="38" x2="34" y2="18" stroke="#a855f7" stroke-width="0.9" stroke-dasharray="2 1.5" marker-end="url(#ah2)"/>
          </svg>
          <div id="players"></div>
          <div class="ball" id="ball" style="left:62%; top:48%"></div>
        </div>
      </main>

      <aside class="hud">
        <div>
          <div class="cap">Team Role <em>Right HUD</em></div>
          <div class="team-grid" id="team">
            <button type="button" class="active att" data-t="att"><span class="d" style="background:#86efac"></span>ATT</button>
            <button type="button" class="def" data-t="def"><span class="d" style="background:#fca5a5"></span>DEF</button>
            <button type="button" class="neu" data-t="neu"><span class="d" style="background:#fde68a"></span>NEU</button>
          </div>
        </div>
        <div>
          <div class="cap">Arrow / Action Type</div>
          <div class="arrow-grid" id="arrows">
            <button type="button" class="active" data-a="dashed">Pass (Dashed)</button>
            <button type="button" data-a="solid">Dribble (Solid)</button>
            <button type="button" data-a="dotted">Run (Dotted)</button>
            <button type="button" data-a="curved">Cross (Curved)</button>
          </div>
        </div>
        <div class="inspector" id="inspector">
          <div class="cap">Player Inspector <em id="sel-num">#4</em></div>
          <div>
            <label>Squad Number</label>
            <input id="num" value="4" />
          </div>
          <div>
            <label>Role / Position</label>
            <input id="role" value="RCB" />
          </div>
          <button type="button" class="remove">🗑 Remove Player</button>
        </div>
      </aside>
    </div>

    <footer>
      <div style="display:flex;align-items:center;gap:10px">
        <button type="button" class="play">▶ Play Sequence</button>
        <div class="frame-meta">Frame <b>2</b> of 3</div>
      </div>
      <div class="phases" id="phases">
        <button type="button" class="phase" data-i="0"><div class="p">PHASE 1</div><div class="n">Build-up</div></button>
        <button type="button" class="phase active" data-i="1"><div class="p">PHASE 2 <span class="dot"></span></div><div class="n">Progress</div></button>
        <button type="button" class="phase" data-i="2"><div class="p">PHASE 3</div><div class="n">Finish</div></button>
      </div>
      <div class="frame-actions">
        <button type="button">＋ Frame</button>
        <button type="button">⧉ Duplicate</button>
        <button type="button">🗑</button>
      </div>
    </footer>
  </div>
  <div class="note"><strong>ACI landscape mock</strong> · Gemini shell · our Label/Shape/Kit on left rail</div>

<script>
  // Progress frame from Gemini demo (x,y are % of horizontal pitch)
  const PLAYERS = [
    { id:'r1', team:'def', num:9,  x:58, y:42, label:'CF' },
    { id:'r2', team:'def', num:10, x:52, y:30, label:'CAM' },
    { id:'r3', team:'def', num:8,  x:44, y:60, label:'CM' },
    { id:'r4', team:'def', num:7,  x:42, y:22, label:'RW' },
    { id:'r5', team:'def', num:11, x:38, y:78, label:'LW' },
    { id:'r6', team:'def', num:6,  x:34, y:48, label:'CDM' },
    { id:'g1', team:'att', num:1,  x:92, y:50, label:'GK' },
    { id:'g2', team:'att', num:4,  x:78, y:34, label:'RCB' },
    { id:'g3', team:'att', num:5,  x:76, y:64, label:'LCB' },
    { id:'g4', team:'att', num:2,  x:58, y:14, label:'RB' },
    { id:'g5', team:'att', num:3,  x:62, y:86, label:'LB' },
    { id:'g6', team:'att', num:6,  x:62, y:48, label:'DM' },
    { id:'g7', team:'att', num:8,  x:50, y:38, label:'RCM' },
    { id:'g8', team:'att', num:10, x:46, y:68, label:'LCM' },
    { id:'g9', team:'att', num:9,  x:32, y:50, label:'ST' },
    { id:'g10',team:'att', num:7,  x:34, y:18, label:'RW' },
    { id:'g11',team:'att', num:11, x:35, y:82, label:'LW' },
  ];

  const HINTS = {
    move: 'MOVE: DRAG PLAYERS & BALL',
    player: 'PLACE PLAYER (ATT)',
    arrow: 'DRAW ARROW (DASHED)',
    ball: 'CLICK PITCH TO PLACE BALL',
    label: 'TAP TO PLACE LABEL',
    shape: 'TAP TO PLACE SHAPE',
    kit: 'TAP TO PLACE KIT',
    erase: 'CLICK ELEMENT TO DELETE',
  };

  const root = document.getElementById('players');
  let selected = 'g2';
  PLAYERS.forEach((p) => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = `player ${p.team}` + (p.id === selected ? ' selected' : '');
    el.style.left = p.x + '%';
    el.style.top = p.y + '%';
    el.dataset.id = p.id;
    el.innerHTML = `${p.num}<span class="role">${p.label}</span>`;
    el.addEventListener('click', () => {
      selected = p.id;
      document.querySelectorAll('.player').forEach((n) => n.classList.toggle('selected', n.dataset.id === selected));
      document.getElementById('sel-num').textContent = '#' + p.num;
      document.getElementById('num').value = String(p.num);
      document.getElementById('role').value = p.label;
    });
    root.appendChild(el);
  });

  function wireSeg(id) {
    document.getElementById(id).addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      [...e.currentTarget.children].forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
    });
  }
  wireSeg('fmt'); wireSeg('zoom');

  document.querySelector('.tools').addEventListener('click', (e) => {
    const t = e.target.closest('.tool');
    if (!t) return;
    document.querySelectorAll('.tool').forEach((x) => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('hint').textContent = HINTS[t.dataset.tool] || HINTS.move;
  });

  document.getElementById('team').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    [...e.currentTarget.children].forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
  });

  document.getElementById('arrows').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    [...e.currentTarget.children].forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
  });

  document.getElementById('phases').addEventListener('click', (e) => {
    const b = e.target.closest('.phase');
    if (!b) return;
    document.querySelectorAll('.phase').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    document.querySelector('.frame-meta').innerHTML = `Frame <b>${Number(b.dataset.i) + 1}</b> of 3`;
  });

  document.getElementById('zones').addEventListener('click', (e) => {
    e.currentTarget.classList.toggle('active');
    document.getElementById('grid').style.display = e.currentTarget.classList.contains('active') ? 'block' : 'none';
  });
</script>
</body>
</html>
